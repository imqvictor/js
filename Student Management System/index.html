<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>

<body>

    <head>
        <h1>Student Management System</h1>
        <p>Welcome to the Student Management System. Please select an option below:</p>
    </head>

    <div class="about-card">
        <form id="fm1">
            <label for="name" id="nlble">Name:</label>
            <input type="text" name="name" id="name">
            <label for="age" id="alble">Age:</label>
            <input type="number" name="age" id="age">
            <label for="mks" id="mlble">Marks</label>
            <input type="text" name="mks" id="mks">
        </form><br>

        <button type="button" id="addStudentBtn">Add Student</button>

        <table id="table" border="1px">
            <thead>
                <tr>
                    <th>No</th>
                    <th>NAME</th>
                    <th>AGE</th>
                    <th>MARKS</th>
                    <th>AVERAGE</th>
                    <th>ACTIONS</th>
                </tr>

            </thead>
            <tbody id="display"></tbody>
        </table>

    </div>
    <script src="script.js"></script>
</body>

</html>
