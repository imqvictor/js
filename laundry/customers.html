<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>laundry management system</title>
</head>

<body>
    <nav>
        <div>
            <h3>Laundry Management System</h3>
        </div>

        <div>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="customers.html">Customers</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="payment.html">Payment</a></li>
            </ul>
        </div>
    </nav>

    <div class="card">
        <div class="customer-nav">
            <h3>Customer Management</h3>
            <input type="text" id="name" placeholder="Enter a name">
            <input type="number" id="phone" placeholder="Enter a phone number">
            <input type="email" id="email" placeholder="Enter an email">
            <input type="date" id="date" placeholder="Enter a date">
            <button type="button" id="addCustomerBtn">Add</button>
        </div>

        <div class="inner-card">
            <div class="inner-nav">
                <p>Customers</p>
                <input type="search" id="searchCustomer" placeholder="search for customers">
            </div>

            <div>
                <ol id="displayCustomers"></ol>
            </div>

        </div>

    </div>
    <script src="script.js"></script>
