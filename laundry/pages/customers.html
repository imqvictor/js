<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>laundry management system</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <nav>
        <div>
            <h3>Laundry Management System</h3>
        </div>

        <div>
            <ul>
                <li><a href="dashboard.html" class="links">Dashboard</a></li>
                <li><a href="customers.html" class="links">Customers</a></li>
                <li><a href="orders.html" class="links">Orders</a></li>
                <li><a href="payment.html" class="links">Payment</a></li>
                <li><a href=""><i class="fa-solid fa-bars"></i></a></li>
            </ul>
        </div>
    </nav>

    <div class="card">
        <div class="customer-nav">
            <h3>Customer Management</h3>
            <input type="text" id="name" placeholder="Enter a name">
            <input type="number" id="phone" placeholder="Enter a phone number">
            <input type="email" id="email" placeholder="Enter an email">
            <button type="button" id="addCustomerBtn">Add</button>
        </div>

        <div class="inner-card">
            <div class="inner-nav">
                <p>Customers</p>
                <input type="search" id="searchCustomer" placeholder="search for customers">
            </div>

            <div>
                <table id="customersTable" border="1">
                    <thead>
                        <th>NO</th>
                        <th>NAME</th>
                        <th>PHONE</th>
                        <th>EMAIL</th>
                        <th>DATE REGISTERED</th>
                        <td>ACTIONS</td>
                    </thead>
                    <tbody id="displayCustomers"></tbody>
                </table>

            </div>

        </div>

    </div>
    <script src="../js/storage.js"></script>
    <script src="../js/customers.js"></script>
</body>

</html>
