<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>laundry management system</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <nav>
        <div>
            <h3>Laundry Management System</h3>
        </div>

        <div>
            <ul>
                <li><a href="dashboard.html" class="links">Dashboard</a></li>
                <li><a href="customers.html" class="links">Customers</a></li>
                <li><a href="orders.html" class="links">Orders</a></li>
                <li><a href="payment.html" class="links">Payment</a></li>
                <li><a href=""><i class="fa-solid fa-bars"></i></a></li>
            </ul>
        </div>
    </nav>

    <div class="card">
        <div class="order-nav">
            <h3>order Management</h3>
            <input type="search" id="searchOrder" placeholder="searchOrder">
            <select id="searchCategory">
                <option value="all">All</option>
                <option value="pending">Pending</option>
                <option value="washing">washing</option>
                <option value="ironing">ironing</option>
                <option value="drying">Drying</option>
                <option value="ready">Ready</option>
                <option value="completed">Completed</option>
            </select>
            <div>
                <label for="selectCustomer">customer:</label>
                <select name="" id="selectCustomer">
                    <option value="">Select Customer</option>
                </select>
                <label for="selectLaundry">Laundry Type:</label>
                <select name="" id="selectLaundry">
                    <option value="" selected>Select Laundry Type</option>
                    <option value="wash">Wash</option>
                    <option value="dry">Dry</option>
                    <option value="iron">Iron</option>
                </select>
                <label for="quatntity">Quantity:</label>
                <input type="number" id="Quantity" placeholder="eg;5">
                <label for="price">Price per item(KES):</label>
                <input type="number" id="price" placeholder="eg;500.00">
                <button type="button" id="addOrderBtn">Add Order</button>
                <p>Total price: <span id="totalPrice">0</span></p>
            </div>
        </div>

        <div class="inner-card">
            <div>
                <table id="ordersTable" border="1">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>CUSTOMERS</th>
                            <th>QUANTITY</th>
                            <th>LAUNDRY TYPE</th>
                            <th>PRICE/ITEM</th>
                            <th>TOTAL PRICE</th>
                            <th>ORDER DATE</th>
                            <th>STATUS</th>
                            <th>ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="displayOrders"> </tbody>
                </table>

            </div>

        </div>

    </div>
    <script src="../js/storage.js"></script>
    <script src="../js/orders.js"></script>
</body>

</html>
