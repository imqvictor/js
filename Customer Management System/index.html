<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="searchDiv">
        <h3>Customer Management</h3>
        <h4>search:</h4>
        <input type="search" id="search" placeholder="search customer"> <br><br>
        <button type="button" id="addBtn" popovertarget="section">Add Customer</button>
    </div>
    <div class="card">

        <section id="section" popover="manual">
            <form id="fm1">
                <input type="text" id="name" placeholder="Enter Name">
                <input type="number" id="phone" placeholder="Enter Phone">
                <input type="email" id="email" placeholder="Enter Email">

                <div>
                    <button type="button" popovertarget="section" popovertargetaction="hide">Close</button>
                    <button type="button" id="addCustomerBtn">Add Customer</button>
                </div>
        </section>

        </form>

        <table class="table" border="1px">
            <thead>
                <th>NO</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Actions</th>
            </thead>
            <tbody id="displayCustomers"></tbody>
        </table>

    </div>

    <script src="script.js"></script>
</body>

</html>
