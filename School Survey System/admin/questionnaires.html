<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaires</title>
    <link rel="stylesheet" href="../css/global.css">

</head>

<body>
    <div class="card">
        <nav>
            <ul>
                <li><a href="adminDashboard.html">Dashboard</a></li>
                <li><a href="questionnaires.html">Questionnaires</a></li>
                <li><a href="responses.html">Responses</a></li>
            </ul>
        </nav>

        <form id="form">
            <label for="questionnaire">Questionnaire Title:</label>
            <textarea name="questionnaireTitle" id="questionnaireTitle" placeholder="Enter the questionnaire title"
                required></textarea><br><br>
            <label for="description">Questionnaire Description:</label>
            <textarea name="description" id="description" placeholder="Enter a question description"
                required></textarea><br><br>
            <label for="question">Question:</label>
            <textarea name="question" id="question" placeholder="Enter the question" required></textarea><br><br>
            <label for="type">Question Type:</label>
            <select id="type" required>
                <option value="">Choose</option>
                <option value="short-text">Short Answer</option>
                <option value="number">Number</option>
                <option value="yes/no">YES/NO</option>
                <option value="multiple-choice">Multiple Choice</option>
            </select><br><br>
            <div class="choices" hidden="true">
                <input type="text" id="choicesInput" placeholder="enter choice">
                <button type="button" id="addChoiceBtn">Add Choice</button><br><br>
                <label for="displayChoices">Current Choices:</label>
                <div id="displayChoices"></div>
            </div>

            <button type="submit" id="createQuestionnaire">Add Questionnaire</button><br><br>
        </form>

        <div class="displayQuestionnaire"></div>

    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/questionnaires.js"></script>
</body>

</html>
